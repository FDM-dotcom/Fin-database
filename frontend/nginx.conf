server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-routing: alle niet-bestaande paden gaan naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-verzoeken proxyen naar de FastAPI-container
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Grote bestanden (CSV-import)
        client_max_body_size 100M;
        proxy_read_timeout   120s;
    }

    # FastAPI interactieve docs (handig voor ontwikkeling)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Statische bestanden cachen
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
